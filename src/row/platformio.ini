; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Base filter: include everything, exclude ALL main_*.cpp entry points
; (top-level or nested under a platform dir, e.g. rp2350/main_led_test.cpp).
; Each named environment appends only its own entry point via ${env.build_src_filter}.
[env]
build_src_filter = +<*> -<**/main*.cpp>
; tile_bus_protocol/ is shared with src/tile/DF2-Tile/ (both sides of the same
; wire protocol) - see src/common/tile_bus_protocol/.
lib_extra_dirs = ../common
; Injects FW_GIT_SHA/FW_DIRTY (see fw_version_info.cpp, include/fw_version.h)
; into every environment below - falls back safely when git isn't available.
extra_scripts = pre:tools/fw_version_env.py

; seeed_xiao_rp2350 has no address baked in - see include/row_address.h.
; It exists so building/uploading it directly (instead of one of row0..row7
; below) fails at compile time with an explanation, rather than either not
; existing as an env name or silently reusing whatever a stale generated
; header last held (the previous, CHIPID-based scheme's failure mode).
[env:seeed_xiao_rp2350]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-rp2350
framework = arduino
build_src_filter = ${env.build_src_filter} +<main.cpp> -<native/>

; One environment per physical row controller (docs/row-bus-protocol.md §3:
; addresses are 0x00-0x07). Pick the env for the board on your bench - by
; name in PlatformIO's own env picker (e.g. the VS Code extension's
; environment switcher), or `pio run -e row3 -t upload` from the CLI - and
; the address is fixed at build time, before anything touches the wire.
;
; This replaces an earlier scheme that read each board's RP2350 CHIPID via
; `picotool otp get` and looked it up in a committed address map. That
; needed the board already in BOOTSEL when the lookup ran, which fought
; with PlatformIO's own upload flow (a 1200-baud touch reset into the
; bootloader) over who puts the board in BOOTSEL and when, and it never
; got far enough to actually assign an address. See include/row_address.h.
[env:row0]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-rp2350
framework = arduino
build_flags = -DMY_ROW_ADDR=0
build_src_filter = ${env.build_src_filter} +<main.cpp> -<native/>

[env:row1]
platform  = https://github.com/Seeed-Studio/platform-seeedboards.git
board     = seeed-xiao-rp2350
framework = arduino
build_flags = -DMY_ROW_ADDR=1
build_src_filter = ${env.build_src_filter} +<main.cpp> -<native/>

