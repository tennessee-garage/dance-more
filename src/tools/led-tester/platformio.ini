; Hand-held LED strip tester - Seeed XIAO ESP32-C3.
; See README.md for the wiring and what the button does.
[env:xiao_esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; LEDS_PER_SIDE comes from the shared protocol header so the tester's LED
; count tracks the real tile geometry (see CLAUDE.md, "LED geometry").
lib_extra_dirs = ../../common
; Same Adafruit-style API as the tinyNeoPixel the tile firmware uses.
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3
