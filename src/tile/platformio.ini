; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Base filter: include everything, exclude ALL main_*.cpp entry points.
; Each named environment appends only its own entry point via ${env.build_src_filter}.
; Adding a new main_foo.cpp test harness requires no changes to other environments.
[env]
build_src_filter = +<*> -<main*.cpp>
; tile_bus_protocol/ is shared with src/row/ (both sides of the same wire
; protocol) - see src/common/tile_bus_protocol/.
lib_extra_dirs = ../common
; Injects FW_GIT_SHA/FW_DIRTY (see fw_version_info.cpp, include/fw_version.h)
; into every environment below - falls back safely when git isn't available.
extra_scripts = pre:tools/fw_version_env.py

; SERIAL_RX_BUFFER_SIZE buys the receive path slack against the wire.
;
; A SET_LEDS frame is MAX_FRAME_SIZE bytes (187 at 60 LEDs/tile) arriving
; back-to-back at 1 Mbps - one byte every 10 us. The per-byte cost of taking
; a byte off the ring and through FrameParser::feed (whose bitwise CRC-16 is
; 8 shift/xor iterations by itself) is the same order as that at 20 MHz, so
; the main loop cannot be relied on to stay ahead of the wire mid-frame; the
; deficit has to sit in the ISR's ring buffer until the loop catches up.
; Overflowing it is silent - bytes are dropped, the frame fails CRC, and the
; display command never lands. A 9-byte SET_COLOR never comes close, which is
; why short commands keep working while SET_LEDS goes missing. Same shape of
; failure as the Row Bus side's Serial2.setFIFOSize() in
; pi_transport_rp2350.cpp.
;
; 128 is the ceiling, not a judgement about what is enough: sizes must be a
; power of two, and 256 does not build. megaTinyCore's HardwareSerial.h
; counts 256 among the sizes its assembly RXC ISR handles and so omits the
; _rx_complete_irq declaration, while UART0/UART1.cpp list only 128/64/32/16
; and still emit the C++ ISR that calls it - the two disagree and the core
; fails to compile. So this holds two thirds of a frame, not a whole one: it
; doubles the slack (~640 us of line time to ~1.28 ms), which covers a drain
; that merely trails the wire, but not a main loop stalled outright.
[env:ATtiny3224]
platform = atmelmegaavr
board = ATtiny3224
framework = arduino
upload_protocol = serialupdi
board_build.f_cpu = 20000000L
lib_deps = https://github.com/SpenceKonde/tinyNeoPixel.git
build_flags = -DSERIAL_RX_BUFFER_SIZE=128
build_src_filter = ${env.build_src_filter} +<main.cpp> -<native/> -<esp32/>

[env:ATtiny3226]
platform = atmelmegaavr
board = ATtiny3226
framework = arduino
upload_protocol = serialupdi
board_build.f_cpu = 20000000L
lib_deps = https://github.com/SpenceKonde/tinyNeoPixel.git
build_flags = -DSERIAL_RX_BUFFER_SIZE=128
build_src_filter = ${env.build_src_filter} +<main.cpp> -<native/> -<esp32/>

[env:ATtiny3224_led_test]
platform = atmelmegaavr
board = ATtiny3224
framework = arduino
upload_protocol = serialupdi
board_build.f_cpu = 20000000L
lib_deps = https://github.com/SpenceKonde/tinyNeoPixel.git
build_src_filter = -<*> +<main_led_test.cpp>

[env:native]
platform = native
build_flags = -DNATIVE -std=c++17 -Isrc
build_src_filter = ${env.build_src_filter} +<main_native.cpp> -<at/> -<esp32/>

[env:test_native]
platform = native
build_flags = -DNATIVE -std=c++17 -Isrc
build_src_filter = ${env.build_src_filter} -<at/> -<esp32/>

[env:esp32c3]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino
build_src_filter = ${env.build_src_filter} +<main_esp32.cpp> -<at/> -<native/>
