[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "df2-pi"
version = "0.1.0"
description = "Dance Floor v2 host controller - drives the Row Bus from a Raspberry Pi"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "gpiozero>=2.0",
    # lgpio is gpiozero's pin-factory backend on the Pi 5 (RP1) - Linux-only,
    # so it's marked out on macOS/Windows dev machines.
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
df2-pi = "df2_pi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
